name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only -a musiqa-yuklash-bot --no-cache --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
